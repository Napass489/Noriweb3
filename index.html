    /**

    let audioCtx = null;
    let isMusicPlaying = false;
    let hasAutoStartedMusic = false;
    let currentTrackIndex = 0;
    let musicNoteStep = 0;

    function getMusicTracks() {

    function renderMusicTrackList() {

      if (currentTrackIndex >= tracks.length) currentTrackIndex = 0;

    function toggleMusicPopover(forceState) {
      const pop = document.getElementById('music-popover');
      if (!pop) return;
      const shouldOpen = typeof forceState === 'boolean' ? forceState : pop.classList.contains('hidden');
      if (shouldOpen) {
        pop.classList.remove('hidden');
        if (!isMusicPlaying) {
          startMusicPlayback();
        }
      } else {
        pop.classList.add('hidden');
      }
    }

    // สร้างเสียงดนตรี Music Box ประสานคอร์ดที่ได้ยินเสียงชัดเจนและไพเราะจริงทุกอุปกรณ์
    function playBellNote(freq) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        // โน้ตหลัก (Triangle + Sine เพื่อให้ได้ยินชัดบนลำโพงมือถือและ iPad)
        const mainOsc = audioCtx.createOscillator();
        const overtoneOsc = audioCtx.createOscillator();
        const mainGain = audioCtx.createGain();
        const overtoneGain = audioCtx.createGain();

        mainOsc.type = 'triangle';
        mainOsc.frequency.setValueAtTime(freq, now);

        overtoneOsc.type = 'sine';
        overtoneOsc.frequency.setValueAtTime(freq * 2, now);

        mainGain.gain.setValueAtTime(0.001, now);
        mainGain.gain.linearRampToValueAtTime(0.22, now + 0.02);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

        overtoneGain.gain.setValueAtTime(0.001, now);
        overtoneGain.gain.linearRampToValueAtTime(0.07, now + 0.015);
        overtoneGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.45);

        mainOsc.connect(mainGain);
        overtoneOsc.connect(overtoneGain);
        mainGain.connect(audioCtx.destination);
        overtoneGain.connect(audioCtx.destination);

        mainOsc.start(now);
        overtoneOsc.start(now);
        mainOsc.stop(now + 0.78);
        overtoneOsc.stop(now + 0.48);
      } catch (e) {
        // ignore audio context restrictions
      }
    }

    function startMusicPlayback() {
      stopMusicScheduler();
      isMusicPlaying = true;
      hasAutoStartedMusic = true;
      musicNoteStep = 0;

      const tracks = getMusicTracks();
      const track = tracks[currentTrackIndex] || tracks[0];

      if (track && track.audioUrl && track.audioUrl.trim() !== '') {
        if (!customAudioEl) {
          customAudioEl = new Audio();
          customAudioEl.loop = true;
        }
        customAudioEl.src = track.audioUrl.trim();
        customAudioEl.volume = 0.75;
        customAudioEl.play().catch(() => {});
      } else {
        const notes = (track && track.notes) || [523.25, 659.25, 783.99, 1046.5];
        const intervalMs = Math.round((60 / ((track && track.tempo) || 120)) * 420);
        playBellNote(notes[0]);
        musicIntervalId = setInterval(() => {
          if (!isMusicPlaying) return;
          musicNoteStep = (musicNoteStep + 1) % notes.length;
          playBellNote(notes[musicNoteStep]);
        }, intervalMs);
      }

      updateMusicDiscUI();
    }

    // แตะหน้าจอจุดไหนก็ได้ครั้งแรก เพลงที่ 1 จะเริ่มเล่นอัตโนมัติทันที
    function setupAutoPlayOnFirstInteraction() {
      const triggerFirstPlay = () => {
        if (!hasAutoStartedMusic && !isMusicPlaying) {
          currentTrackIndex = 0;
          startMusicPlayback();
        }
        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evt) => {
          document.removeEventListener(evt, triggerFirstPlay, { capture: true });
        });
      };

      ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evt) => {
        document.addEventListener(evt, triggerFirstPlay, { capture: true, passive: true });
      });
    }
